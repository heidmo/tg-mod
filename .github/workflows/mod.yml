name: 群管理

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: tg-mod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 执行群管理
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_GROUP_ID: ${{ vars.TG_GROUP_ID }}
        run: python3 scripts/tg_mod.py once

      - name: 保存状态
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/tg_mod_state.json state/tg_mod.log 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "状态无变化"
          else
            git commit -m "chore: 更新违规记录 [skip ci]"
            git push
          fi
